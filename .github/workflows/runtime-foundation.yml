name: Runtime foundation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  runtime-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static checker
        run: python -m pip install --disable-pip-version-check ruff==0.8.4

      - name: Check Python style and syntax
        run: |
          ruff check apps/runtime evaluation/replay
          python -m compileall -q apps/runtime evaluation/replay

      - name: Check single Runtime source boundary
        shell: bash
        run: |
          test -d apps/runtime/app
          test -d apps/runtime/workers
          test -f apps/runtime/main.py
          test ! -e app
          test ! -e workers
          test ! -e main.py
          test "$(git ls-files 'app/**' 'workers/**' 'main.py' | wc -l | tr -d ' ')" = "0"
          test "$(git ls-files 'apps/runtime/app/**' 'apps/runtime/workers/**' | wc -l | tr -d ' ')" -gt "0"

      - name: Check Compose definitions
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null --profile broker config --quiet
