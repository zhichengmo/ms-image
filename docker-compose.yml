services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - BROKER_ENABLED=${BROKER_ENABLED:-false}
      - AI_RECEIPT_SIGNING_KEY=${AI_RECEIPT_SIGNING_KEY:-}
      - AI_EGRESS_PROOF_SIGNING_KEY=${AI_EGRESS_PROOF_SIGNING_KEY:-}
      - AI_QUALIFICATION_ARTIFACT_SIGNING_KEY=${AI_QUALIFICATION_ARTIFACT_SIGNING_KEY:-}
    env_file:
      - path: .env.example
        required: true
      - path: .env-01
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build: .
    command: ["uvicorn", "main:admin_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - ENV=dev
      - BROKER_ENABLED=${BROKER_ENABLED:-false}
      - AI_RECEIPT_SIGNING_KEY=${AI_RECEIPT_SIGNING_KEY:-}
      - AI_EGRESS_PROOF_SIGNING_KEY=${AI_EGRESS_PROOF_SIGNING_KEY:-}
      - AI_QUALIFICATION_ARTIFACT_SIGNING_KEY=${AI_QUALIFICATION_ARTIFACT_SIGNING_KEY:-}
    env_file:
      - path: .env.example
        required: true
      - path: .env-01
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ms_image
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    profiles: ["broker"]
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
