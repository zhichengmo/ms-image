x-runtime-environment: &runtime-environment
  ENV: ${COMPOSE_ENV:-dev}
  APPLICATION_HOST: 0.0.0.0
  MYSQL_DB: ${COMPOSE_MYSQL_DB:-ms_image}
  MYSQL_HOST: ${COMPOSE_MYSQL_HOST:-mysql}
  MYSQL_PORT: ${COMPOSE_MYSQL_PORT:-3306}
  MYSQL_USER: ${COMPOSE_MYSQL_USER:-root}
  MYSQL_PW: ${COMPOSE_MYSQL_PASSWORD:-password}
  MYSQL_EVALUATION_DB: ${COMPOSE_MYSQL_EVALUATION_DB:-ms_image_eval}
  MYSQL_EVALUATION_HOST: ${COMPOSE_MYSQL_EVALUATION_HOST:-mysql-evaluation}
  MYSQL_EVALUATION_PORT: ${COMPOSE_MYSQL_EVALUATION_PORT:-3306}
  MYSQL_EVALUATION_USER: ${COMPOSE_MYSQL_EVALUATION_USER:-root}
  MYSQL_EVALUATION_PW: ${COMPOSE_MYSQL_EVALUATION_PASSWORD:-password}
  REDIS_HOST: ${COMPOSE_REDIS_HOST:-redis}
  REDIS_PORT: ${COMPOSE_REDIS_PORT:-6379}
  REDIS_PASSWORD: ""
  RABBITMQ_HOST: ${COMPOSE_RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PASSWORD: ${COMPOSE_RABBITMQ_PASSWORD:-password}
  RABBITMQ_PORT: ${COMPOSE_RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${COMPOSE_RABBITMQ_USERNAME:-admin}
  RABBITMQ_VIRTUAL_HOST: ${COMPOSE_RABBITMQ_VIRTUAL_HOST:-/}

x-runtime-env-files: &runtime-env-files
  - path: .env-01
    required: false

services:
  app:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: ${BROKER_ENABLED:-false}
      AI_RECEIPT_SIGNING_KEY: ${AI_RECEIPT_SIGNING_KEY:-}
      AI_EGRESS_PROOF_SIGNING_KEY: ${AI_EGRESS_PROOF_SIGNING_KEY:-}
      AI_QUALIFICATION_ARTIFACT_SIGNING_KEY: ${AI_QUALIFICATION_ARTIFACT_SIGNING_KEY:-}
    env_file: *runtime-env-files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["uvicorn", "apps.backend.services.runtime.main:admin_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: ${BROKER_ENABLED:-false}
      AI_RECEIPT_SIGNING_KEY: ${AI_RECEIPT_SIGNING_KEY:-}
      AI_EGRESS_PROOF_SIGNING_KEY: ${AI_EGRESS_PROOF_SIGNING_KEY:-}
      AI_QUALIFICATION_ARTIFACT_SIGNING_KEY: ${AI_QUALIFICATION_ARTIFACT_SIGNING_KEY:-}
    env_file: *runtime-env-files
    depends_on:
      mysql:
        condition: service_healthy
      mysql-evaluation:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-control:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["uvicorn", "apps.backend.services.ai_control.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: false
    env_file: *runtime-env-files
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation-control:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["uvicorn", "apps.backend.services.evaluation_control.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: false
    env_file: *runtime-env-files
    depends_on:
      mysql:
        condition: service_healthy
      mysql-evaluation:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  imaging-worker:
    profiles: ["broker", "scheduler"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["celery", "-A", "apps.backend.workers.imaging_worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=imaging.image.validate", "--hostname=imaging-worker@%h"]
    # The default 120-second hard task limit plus a small shutdown allowance.
    # SIGTERM triggers Celery warm shutdown, so no new message is accepted
    # while the single active lease is allowed to finish.
    stop_grace_period: 130s
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.backend.workers.imaging_worker.celery_app:celery_app inspect ping -d imaging-worker@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: true
      IMAGING_WORKER_CONCURRENCY: ${IMAGING_WORKER_CONCURRENCY:-1}
      AI_ATTEMPT_RECONCILE_POLICY_VERSION: ${AI_ATTEMPT_RECONCILE_POLICY_VERSION:-ai-attempt-reconcile.v1}
      AI_ATTEMPT_RECONCILE_MAX_COUNT: ${AI_ATTEMPT_RECONCILE_MAX_COUNT:-3}
      AI_ATTEMPT_RECONCILE_MAX_UNKNOWN_AGE_SECONDS: ${AI_ATTEMPT_RECONCILE_MAX_UNKNOWN_AGE_SECONDS:-10800}
      AI_RECEIPT_SIGNING_KEY: ${AI_RECEIPT_SIGNING_KEY:-}
      AI_EGRESS_PROOF_SIGNING_KEY: ${AI_EGRESS_PROOF_SIGNING_KEY:-}
      AI_QUALIFICATION_ARTIFACT_SIGNING_KEY: ${AI_QUALIFICATION_ARTIFACT_SIGNING_KEY:-}
    env_file: *runtime-env-files
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # This is the repository-owned scheduler for imaging Attempt reconciliation.
  # Run exactly one replica and do not enable this profile when an external
  # CronJob/platform scheduler already owns the same periodic task.
  imaging-scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["celery", "-A", "apps.backend.workers.imaging_worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/ms-image-ai-attempt-reconcile-celerybeat"]
    stop_grace_period: 30s
    deploy:
      replicas: 1
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: true
      AI_ATTEMPT_RECONCILE_SCHEDULE_ENABLED: true
      AI_ATTEMPT_RECONCILE_INTERVAL_SECONDS: ${AI_ATTEMPT_RECONCILE_INTERVAL_SECONDS:-60}
      AI_ATTEMPT_RECONCILE_BATCH_LIMIT: ${AI_ATTEMPT_RECONCILE_BATCH_LIMIT:-50}
    env_file: *runtime-env-files
    depends_on:
      imaging-worker:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  evaluation-worker:
    profiles: ["broker"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["celery", "-A", "apps.backend.workers.evaluation_worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=evaluation.job.execute", "--hostname=evaluation-worker@%h"]
    # Keep the upgrade drain window aligned with the default 120-second task
    # hard limit.  Increase this with the task lease if that lease changes.
    stop_grace_period: 130s
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.backend.workers.evaluation_worker.celery_app:celery_app inspect ping -d evaluation-worker@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: true
      EVALUATION_WORKER_CONCURRENCY: ${EVALUATION_WORKER_CONCURRENCY:-1}
      AI_RECEIPT_SIGNING_KEY: ${AI_RECEIPT_SIGNING_KEY:-}
      AI_EGRESS_PROOF_SIGNING_KEY: ${AI_EGRESS_PROOF_SIGNING_KEY:-}
      AI_QUALIFICATION_ARTIFACT_SIGNING_KEY: ${AI_QUALIFICATION_ARTIFACT_SIGNING_KEY:-}
    env_file: *runtime-env-files
    depends_on:
      mysql-evaluation:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  imaging-relay:
    profiles: ["broker"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "apps.backend.workers.imaging_worker.outbox_relay"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import os; import time; p=Path(os.getenv('IMAGING_RELAY_HEARTBEAT_PATH', '/tmp/ms-image-imaging-relay.heartbeat')); raise SystemExit(0 if p.is_file() and time.time() - p.stat().st_mtime <= 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: true
    env_file: *runtime-env-files
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  evaluation-relay:
    profiles: ["broker"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "apps.backend.workers.evaluation_worker.outbox_relay"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import os; import time; p=Path(os.getenv('EVALUATION_RELAY_HEARTBEAT_PATH', '/tmp/ms-image-evaluation-relay.heartbeat')); raise SystemExit(0 if p.is_file() and time.time() - p.stat().st_mtime <= 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *runtime-environment
      BROKER_ENABLED: true
    env_file: *runtime-env-files
    depends_on:
      mysql-evaluation:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${COMPOSE_MYSQL_DB:-ms_image}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${COMPOSE_MYSQL_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-evaluation:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${COMPOSE_MYSQL_EVALUATION_PASSWORD:-password}
      MYSQL_DATABASE: ${COMPOSE_MYSQL_EVALUATION_DB:-ms_image_eval}
    volumes:
      - mysql_evaluation_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${COMPOSE_MYSQL_EVALUATION_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    profiles: ["broker", "scheduler"]
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${COMPOSE_RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${COMPOSE_RABBITMQ_PASSWORD:-password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
  mysql_evaluation_data:
  redis_data:
  rabbitmq_data:
